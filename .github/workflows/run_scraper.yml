name: Run Universal Job Scraper

on:
  schedule:
    # Runs automatically at 7:00 AM Central Time (12:00 UTC) every single day
    - cron: '0 12 * * *'
  workflow_dispatch: # Adds a manual run button to your dashboard

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install website parsers
        run: pip install requests beautifulsoup4

      - name: Execute Scraper and Send Emails
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python job_alert.py
